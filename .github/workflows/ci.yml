name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.13" ]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - run: python -m pip install --upgrade pip
    - run: python -m pip install -e ".[test]"
    - run: python -m pytest -m "not slow" --timeout=120 --junitxml=junit.xml
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: junit.xml
        if-no-files-found: ignore

  soak:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
    - run: python -m pip install -e ".[test]"
    - run: python -m pytest -m slow --timeout=600

  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
    - run: python -m pip install --upgrade pip build twine
    - run: python -m build
    - run: python -m twine check dist/*
    - run: python -m pip install dist/*.whl
    - run: cd "$RUNNER_TEMP" && python -c "import glitchylogger; print(glitchylogger.__file__)"
